name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the Python distribution
        run: python -m pip install .
      - name: Run Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Check the installed Python CLI outside the checkout
        run: python -c "import subprocess,sys,tempfile; subprocess.run([sys.executable,'-m','orqivra.cli','--help'],cwd=tempfile.gettempdir(),check=True)"
      - name: Build wheel and source archive
        run: |
          python -m pip install build
          python -m build --outdir dist

  node:
    name: Node.js 24 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: node/package-lock.json
      - name: Install locked development tools
        run: npm ci --prefix node
      - name: Build and test the Node CLI
        run: npm test --prefix node

  parity:
    name: Python and Node parity on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: node/package-lock.json
      - name: Install the Python CLI
        run: python -m pip install .
      - name: Install locked Node development tools
        run: npm ci --prefix node
      - name: Build and test the Node CLI
        run: npm test --prefix node
      - name: Run cross-language acceptance and interoperability checks
        run: python tests/parity/run_parity.py
